<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thư viện ảnh · Azure Blob Storage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ===== Bảng màu ===== */
:root {
  --bg: #f6f7fc;
  --surface: #ffffff;
  --surface-2: #f0f2f9;
  --line: #e4e7f2;
  --text: #0e1120;
  --muted: #6b7291;
  --brand: #6366f1;
  --brand-2: #a855f7;
  --ok: #17a673;
  --danger: #e5484d;
  --shadow-sm: 0 1px 2px rgba(14,17,32,.05);
  --shadow: 0 2px 4px rgba(14,17,32,.04), 0 12px 32px rgba(14,17,32,.07);
  --shadow-lg: 0 24px 64px rgba(14,17,32,.16);
  --orb-1: rgba(99,102,241,.28);
  --orb-2: rgba(168,85,247,.22);
}
[data-theme="dark"] {
  --bg: #0a0c15;
  --surface: #131626;
  --surface-2: #1a1e30;
  --line: #262b41;
  --text: #eef0f8;
  --muted: #8b92ad;
  --brand: #7c7ff5;
  --brand-2: #b975f8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow: 0 2px 4px rgba(0,0,0,.2), 0 12px 32px rgba(0,0,0,.35);
  --shadow-lg: 0 24px 64px rgba(0,0,0,.6);
  --orb-1: rgba(99,102,241,.3);
  --orb-2: rgba(168,85,247,.22);
}

html { scroll-behavior: smooth; }
body {
  font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background .3s, color .3s;
  overflow-x: hidden;
}

/* Vệt sáng nền */
body::before, body::after {
  content: ""; position: fixed; border-radius: 50%;
  filter: blur(90px); pointer-events: none; z-index: 0;
}
body::before { width: 480px; height: 480px; background: var(--orb-1); top: -180px; left: -120px; }
body::after  { width: 420px; height: 420px; background: var(--orb-2); top: -80px;  right: -140px; }

.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 44px 24px 96px; }

/* ===== Header ===== */
header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 36px; }
.logo {
  width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
  background: linear-gradient(140deg, var(--brand), var(--brand-2));
  display: grid; place-items: center;
  box-shadow: 0 8px 22px rgba(99,102,241,.36);
}
.logo svg { width: 24px; height: 24px; stroke: #fff; }
.head-txt { flex: 1; }
h1 {
  font-size: 30px; font-weight: 700; letter-spacing: -.025em;
  background: linear-gradient(100deg, var(--text) 30%, var(--brand));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.sub { color: var(--muted); font-size: 15px; }

.icon-btn {
  width: 40px; height: 40px; flex-shrink: 0;
  border: 1px solid var(--line); border-radius: 11px;
  background: var(--surface); color: var(--muted);
  display: grid; place-items: center; cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: color .18s, border-color .18s, transform .18s;
}
.icon-btn:hover { color: var(--brand); border-color: var(--brand); }
.icon-btn:active { transform: scale(.93); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[data-theme="light"] .moon, [data-theme="dark"] .sun { display: none; }

/* ===== Vùng thả file ===== */
.drop {
  position: relative; display: block;
  background: var(--surface);
  border: 1.5px dashed var(--line);
  border-radius: 20px; padding: 46px 24px;
  text-align: center; cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: border-color .2s, background .2s, transform .2s, box-shadow .2s;
}
.drop:hover { border-color: var(--brand); box-shadow: var(--shadow); }
.drop.over {
  border-color: var(--brand); border-style: solid;
  background: linear-gradient(var(--surface), var(--surface)) padding-box;
  transform: scale(1.01); box-shadow: 0 0 0 4px rgba(99,102,241,.14), var(--shadow);
}
.drop-ico {
  width: 56px; height: 56px; margin: 0 auto 14px;
  border-radius: 16px; background: var(--surface-2);
  display: grid; place-items: center;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), background .2s;
}
.drop:hover .drop-ico, .drop.over .drop-ico {
  transform: translateY(-5px);
  background: linear-gradient(140deg, var(--brand), var(--brand-2));
}
.drop-ico svg { width: 24px; height: 24px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: stroke .2s; }
.drop:hover .drop-ico svg, .drop.over .drop-ico svg { stroke: #fff; }
.drop strong { display: block; font-size: 16px; font-weight: 600; margin-bottom: 3px; }
.drop span { color: var(--muted); font-size: 13.5px; }
.drop input { display: none; }

/* ===== Hàng chờ upload ===== */
.queue { margin-top: 16px; display: none; }
.queue.show { display: block; animation: rise .3s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

.row {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  animation: rise .28s ease both;
}
.row.done { border-color: rgba(23,166,115,.4); }
.row.fail { border-color: rgba(229,72,77,.4); }
.row > img { width: 50px; height: 50px; border-radius: 11px; object-fit: cover; flex-shrink: 0; }
.row-mid { flex: 1; min-width: 0; }
.row-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { font-size: 12.5px; color: var(--muted); }
.track { height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 7px; overflow: hidden; }
.fill {
  height: 100%; width: 0%; border-radius: 4px;
  background: linear-gradient(90deg, var(--brand), var(--brand-2));
  transition: width .2s ease;
}
.row.done .fill { background: var(--ok); }
.row.fail .fill { background: var(--danger); width: 100% !important; }
.row-x {
  border: 0; background: none; color: var(--muted);
  font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px;
  border-radius: 8px; transition: color .15s, background .15s;
}
.row-x:hover { color: var(--danger); background: var(--surface-2); }

.queue-foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.queue-sum { flex: 1; font-size: 13.5px; color: var(--muted); }

.btn {
  border: 0; border-radius: 12px; padding: 11px 22px;
  font-family: inherit; font-size: 14px; font-weight: 600;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: #fff; cursor: pointer;
  box-shadow: 0 6px 18px rgba(99,102,241,.32);
  transition: transform .16s, box-shadow .16s, opacity .16s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(99,102,241,.4); }
.btn:active:not(:disabled) { transform: translateY(0) scale(.98); }
.btn:disabled { opacity: .5; cursor: default; box-shadow: none; }
.btn-soft {
  background: var(--surface); color: var(--muted);
  border: 1px solid var(--line); box-shadow: none;
}
.btn-soft:hover:not(:disabled) { color: var(--text); box-shadow: var(--shadow-sm); transform: none; }

.spin {
  display: inline-block; width: 13px; height: 13px; margin-right: 8px;
  border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
  border-radius: 50%; animation: spin .6s linear infinite; vertical-align: -2px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Thanh công cụ thư viện ===== */
.bar { display: flex; align-items: center; gap: 12px; margin: 44px 0 18px; flex-wrap: wrap; }
h2 { font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
.count {
  font-size: 12.5px; font-weight: 500; color: var(--muted);
  background: var(--surface-2); padding: 3px 11px; border-radius: 20px;
}
.bar-sp { flex: 1; }
.search { position: relative; }
.search svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2;
}
.search input {
  font-family: inherit; font-size: 13.5px; color: var(--text);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 11px; padding: 9px 14px 9px 34px; width: 210px;
  outline: none; transition: border-color .18s, box-shadow .18s, width .2s;
}
.search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(99,102,241,.13); width: 240px; }
.search input::placeholder { color: var(--muted); }

/* ===== Lưới ảnh ===== */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }

.tile {
  position: relative; aspect-ratio: 1;
  border-radius: 18px; overflow: hidden;
  background: var(--surface-2); border: 1px solid var(--line);
  cursor: zoom-in; animation: pop .4s cubic-bezier(.2,.8,.3,1) both;
  transition: transform .28s cubic-bezier(.2,.8,.3,1), box-shadow .28s;
}
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } }
.tile:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .45s cubic-bezier(.2,.8,.3,1); }
.tile:hover img { transform: scale(1.08); }
.veil {
  position: absolute; inset: 0;
  background: linear-gradient(transparent 45%, rgba(6,8,18,.82));
  opacity: 0; transition: opacity .25s;
  display: flex; flex-direction: column; justify-content: flex-end; padding: 12px;
}
.tile:hover .veil { opacity: 1; }
.veil-name { color: #fff; font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.veil-acts { display: flex; gap: 6px; margin-top: 8px; }
.chip {
  border: 0; border-radius: 8px; padding: 5px 9px;
  background: rgba(255,255,255,.16); backdrop-filter: blur(8px);
  color: #fff; font-family: inherit; font-size: 11.5px; font-weight: 500;
  cursor: pointer; transition: background .15s;
}
.chip:hover { background: rgba(255,255,255,.32); }

.skel { background: var(--surface-2); border-color: transparent; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

.empty {
  grid-column: 1 / -1; text-align: center; padding: 64px 24px;
  border: 1.5px dashed var(--line); border-radius: 20px; color: var(--muted);
}
.empty svg { width: 40px; height: 40px; stroke: var(--muted); fill: none; stroke-width: 1.5; margin-bottom: 12px; opacity: .6; }
.empty strong { display: block; color: var(--text); font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.empty span { font-size: 13.5px; }

/* ===== Xem ảnh lớn ===== */
.box {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(6,8,18,.88); backdrop-filter: blur(14px);
  display: none; place-items: center; padding: 40px;
}
.box.show { display: grid; animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; } }
.box-in { text-align: center; animation: zoom .28s cubic-bezier(.2,.8,.3,1); max-width: 100%; }
@keyframes zoom { from { transform: scale(.94); opacity: 0; } }
.box img { max-width: 100%; max-height: 78vh; border-radius: 14px; box-shadow: var(--shadow-lg); display: block; }
.box-bar { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; }
.box-name { color: #d5d8e6; font-size: 13px; max-width: 50vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border: 0; border-radius: 50%;
  background: rgba(255,255,255,.12); backdrop-filter: blur(10px);
  color: #fff; font-size: 22px; cursor: pointer;
  display: grid; place-items: center; transition: background .16s;
}
.nav:hover { background: rgba(255,255,255,.28); }
.nav.prev { left: 24px; } .nav.next { right: 24px; }
.box-x { position: absolute; top: 24px; right: 24px; }

/* ===== Thông báo ===== */
.toasts { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--line); border-left: 3px solid var(--brand);
  padding: 11px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 500;
  box-shadow: var(--shadow); max-width: 92vw;
  animation: slide .3s cubic-bezier(.2,.8,.3,1) both;
}
.toast.out { animation: slideOut .25s ease forwards; }
.toast.ok { border-left-color: var(--ok); }
.toast.err { border-left-color: var(--danger); }
@keyframes slide { from { opacity: 0; transform: translateY(20px) scale(.96); } }
@keyframes slideOut { to { opacity: 0; transform: translateY(12px) scale(.96); } }

@media (max-width: 600px) {
  .wrap { padding: 32px 16px 72px; }
  h1 { font-size: 24px; }
  .search input, .search input:focus { width: 100%; }
  .search { width: 100%; }
  .nav.prev { left: 8px; } .nav.next { right: 8px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8.5" cy="8.5" r="1.6"/>
        <path d="M21 14.5L16.5 10 5.5 21"/>
      </svg>
    </div>
    <div class="head-txt">
      <h1>Thư viện ảnh</h1>
      <p class="sub">Upload và hiển thị hình từ Azure Blob Storage</p>
    </div>
    <button class="icon-btn" id="theme" title="Đổi giao diện sáng/tối">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <!-- Kéo thả hoặc bấm chọn -->
  <label class="drop" id="drop">
    <div class="drop-ico">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/></svg>
    </div>
    <strong>Kéo ảnh vào đây hoặc bấm để chọn</strong>
    <span>Chọn được nhiều ảnh · PNG, JPG, GIF, WEBP</span>
    <input type="file" id="file" accept="image/*" multiple>
  </label>

  <!-- Danh sách ảnh chờ upload -->
  <div class="queue" id="queue">
    <div id="rows"></div>
    <div class="queue-foot">
      <span class="queue-sum" id="sum"></span>
      <button class="btn btn-soft" id="clear">Xoá hết</button>
      <button class="btn" id="send">Upload</button>
    </div>
  </div>

  <div class="bar">
    <h2>Đã lưu trên Azure</h2>
    <span class="count" id="count">…</span>
    <span class="bar-sp"></span>
    <div class="search">
      <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Tìm theo tên ảnh…">
    </div>
    <button class="icon-btn" id="refresh" title="Tải lại">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- Xem ảnh lớn -->
<div class="box" id="box">
  <button class="icon-btn box-x" id="boxX" style="background:rgba(255,255,255,.12);border:0;color:#fff">
    <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <button class="nav prev" id="prev">‹</button>
  <button class="nav next" id="next">›</button>
  <div class="box-in">
    <img id="boxImg" alt="">
    <div class="box-bar">
      <span class="box-name" id="boxName"></span>
      <button class="chip" id="boxCopy" style="background:rgba(255,255,255,.14)">Copy link</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
const $ = id => document.getElementById(id);

/* ===== Giao diện sáng / tối ===== */
const saved = localStorage.getItem("theme");
if (saved) document.documentElement.dataset.theme = saved;
$("theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("theme", next);
});

/* ===== Thông báo ===== */
function toast(msg, type) {
  const el = document.createElement("div");
  el.className = "toast " + (type || "");
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => {
    el.classList.add("out");
    setTimeout(() => el.remove(), 250);
  }, 3000);
}

const fmtSize = b => b < 1024 * 1024
  ? (b / 1024).toFixed(0) + " KB"
  : (b / 1024 / 1024).toFixed(1) + " MB";

/* ===== Hàng chờ upload ===== */
let queue = [];   // [{ file, el, fill, meta }]

function addFiles(files) {
  [...files].forEach(file => {
    if (!file.type.startsWith("image/")) {
      toast(file.name + " không phải file ảnh", "err");
      return;
    }
    const el = document.createElement("div");
    el.className = "row";
    el.innerHTML =
      '<img alt=""><div class="row-mid">' +
      '<div class="row-name"></div><div class="row-meta"></div>' +
      '<div class="track"><div class="fill"></div></div></div>' +
      '<button class="row-x" title="Bỏ ảnh này">&times;</button>';

    el.querySelector("img").src = URL.createObjectURL(file);
    el.querySelector(".row-name").textContent = file.name;
    el.querySelector(".row-meta").textContent = fmtSize(file.size);

    const item = { file, el, fill: el.querySelector(".fill"), meta: el.querySelector(".row-meta") };
    el.querySelector(".row-x").addEventListener("click", ev => {
      ev.preventDefault();
      queue = queue.filter(x => x !== item);
      el.remove();
      render();
    });

    queue.push(item);
    $("rows").appendChild(el);
  });
  render();
}

function render() {
  $("queue").classList.toggle("show", queue.length > 0);
  const total = queue.reduce((s, x) => s + x.file.size, 0);
  $("sum").textContent = queue.length
    ? queue.length + " ảnh · " + fmtSize(total)
    : "";
}

$("clear").addEventListener("click", e => {
  e.preventDefault();
  queue = [];
  $("rows").innerHTML = "";
  $("file").value = "";
  render();
});

$("file").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });

/* ===== Kéo thả ===== */
const drop = $("drop");
["dragenter", "dragover"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));

/* ===== Upload từng ảnh, có phần trăm thật ===== */
function uploadOne(item) {
  return new Promise(resolve => {
    const body = new FormData();
    body.append("image", item.file);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");

    xhr.upload.addEventListener("progress", e => {
      if (!e.lengthComputable) return;
      const pct = Math.round((e.loaded / e.total) * 100);
      item.fill.style.width = pct + "%";
      item.meta.textContent = fmtSize(item.file.size) + " · " + pct + "%";
    });

    xhr.addEventListener("load", () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch (_) {}
      if (xhr.status === 200 && !data.error) {
        item.el.classList.add("done");
        item.fill.style.width = "100%";
        item.meta.textContent = "Đã tải lên";
        resolve(true);
      } else {
        item.el.classList.add("fail");
        item.meta.textContent = "Lỗi: " + (data.error || "HTTP " + xhr.status);
        resolve(false);
      }
    });

    xhr.addEventListener("error", () => {
      item.el.classList.add("fail");
      item.meta.textContent = "Lỗi kết nối";
      resolve(false);
    });

    xhr.send(body);
  });
}

$("send").addEventListener("click", async e => {
  e.preventDefault();
  if (!queue.length) return;

  const btn = $("send");
  btn.disabled = true;
  $("clear").disabled = true;
  btn.innerHTML = '<span class="spin"></span>Đang tải lên';

  let ok = 0;
  for (const item of queue) {
    if (await uploadOne(item)) ok++;
  }

  btn.disabled = false;
  $("clear").disabled = false;
  btn.textContent = "Upload";

  const fail = queue.length - ok;
  if (ok) toast("Đã upload " + ok + " ảnh", "ok");
  if (fail) toast(fail + " ảnh thất bại", "err");

  // Dọn các ảnh đã upload xong, giữ lại ảnh lỗi để thử lại
  setTimeout(() => {
    queue = queue.filter(x => {
      if (x.el.classList.contains("done")) { x.el.remove(); return false; }
      return true;
    });
    render();
  }, 900);

  loadImages();
});

/* ===== Thư viện ===== */
let all = [];      // toàn bộ ảnh
let shown = [];    // ảnh đang hiển thị (sau khi lọc)

async function loadImages() {
  const grid = $("grid");
  grid.innerHTML = '<div class="tile skel"></div>'.repeat(4);
  try {
    const res = await fetch("/api/images");
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    all = data.reverse();          // ảnh mới nhất lên trước
    draw();
  } catch (err) {
    $("count").textContent = "—";
    grid.innerHTML =
      '<div class="empty"><strong>Không tải được danh sách ảnh</strong><span>' +
      err.message + "</span></div>";
  }
}

function draw() {
  const kw = $("q").value.trim().toLowerCase();
  shown = kw ? all.filter(i => i.name.toLowerCase().includes(kw)) : all;

  $("count").textContent = all.length + " ảnh";
  const grid = $("grid");
  grid.innerHTML = "";

  if (!shown.length) {
    grid.innerHTML =
      '<div class="empty">' +
      '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/>' +
      '<path d="M21 14.5L16.5 10 5.5 21"/></svg>' +
      (kw
        ? "<strong>Không tìm thấy ảnh nào</strong><span>Thử từ khoá khác xem sao</span>"
        : "<strong>Chưa có ảnh nào</strong><span>Hãy upload tấm đầu tiên!</span>") +
      "</div>";
    return;
  }

  shown.forEach((img, i) => {
    const tile = document.createElement("figure");
    tile.className = "tile";
    tile.style.animationDelay = Math.min(i * 45, 450) + "ms";
    tile.innerHTML =
      '<img src="' + img.url + '" alt="" loading="lazy">' +
      '<div class="veil"><div class="veil-name"></div>' +
      '<div class="veil-acts"><button class="chip copy">Copy link</button>' +
      '<button class="chip open">Mở tab mới</button></div></div>';

    tile.querySelector(".veil-name").textContent = img.name;
    tile.addEventListener("click", () => openBox(i));
    tile.querySelector(".copy").addEventListener("click", e => { e.stopPropagation(); copy(img.url); });
    tile.querySelector(".open").addEventListener("click", e => { e.stopPropagation(); window.open(img.url, "_blank"); });
    grid.appendChild(tile);
  });
}

function copy(url) {
  navigator.clipboard.writeText(url)
    .then(() => toast("Đã copy link ảnh", "ok"))
    .catch(() => toast("Trình duyệt không cho copy", "err"));
}

$("q").addEventListener("input", draw);
$("refresh").addEventListener("click", loadImages);

/* ===== Xem ảnh lớn ===== */
let cur = 0;

function openBox(i) {
  cur = i;
  $("boxImg").src = shown[i].url;
  $("boxName").textContent = shown[i].name;
  $("box").classList.add("show");
}
function move(step) {
  if (!shown.length) return;
  openBox((cur + step + shown.length) % shown.length);
}
const closeBox = () => $("box").classList.remove("show");

$("box").addEventListener("click", e => { if (e.target.id === "box") closeBox(); });
$("boxX").addEventListener("click", closeBox);
$("prev").addEventListener("click", e => { e.stopPropagation(); move(-1); });
$("next").addEventListener("click", e => { e.stopPropagation(); move(1); });
$("boxCopy").addEventListener("click", e => { e.stopPropagation(); copy(shown[cur].url); });

document.addEventListener("keydown", e => {
  if (!$("box").classList.contains("show")) return;
  if (e.key === "Escape") closeBox();
  if (e.key === "ArrowLeft") move(-1);
  if (e.key === "ArrowRight") move(1);
});

loadImages();
</script>
</body>
</html>
